apiVersion: batch/v1
kind: Job
metadata:
    name: load-test-in-cluster
    namespace: relaywave
spec:
    backoffLimit: 0
    template:
        spec:
            restartPolicy: Never
            containers:
                - name: load-test
                  image: python:3.12-slim
                  command: ['sh', '-c']
                  args:
                      - >
                          pip install --quiet httpx httpx-ws &&
                          python /scripts/load_test.py
                          --base-url http://backend:8000
                          --connections 90
                          --duration 30
                  volumeMounts:
                      - name: script
                        mountPath: /scripts
            volumes:
                - name: script
                  configMap:
                      name: load-test-script
