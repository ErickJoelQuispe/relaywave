# Phase 1: Postgres is now exposed on 127.0.0.1:5432 so the API can run
# locally with `uv run uvicorn --reload` against the same database the
# containers use. Phase 2 does the same for Redis (127.0.0.1:6379): the API
# now pings Redis at startup, but the Pub/Sub fan-out itself (RoomBroadcaster)
# is not yet wired into the WebSocket route — see docs/project-definition.md.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: relaywave-backend
      ENVIRONMENT: local
      DEBUG: "true"
      # In-container URL: postgres is reached by its service name on the
      # Compose network. asyncpg driver scheme.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relaywave}:${POSTGRES_PASSWORD:-relaywave}@postgres:5432/${POSTGRES_DB:-relaywave}
      # Same reasoning as DATABASE_URL: redis is reached by its service name
      # on the Compose network, not by the loopback address the host uses.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl; use the stdlib instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

  postgres:
    image: postgres:16-alpine
    ports:
      # Loopback-only host access for local `uv run` development. Never
      # exposed to the external network.
      - "127.0.0.1:5432:5432"
    environment:
      # Read from root .env (see .env.example). Because Postgres is now
      # host-reachable, set a real POSTGRES_PASSWORD instead of the old
      # relaywave/relaywave dev default.
      POSTGRES_USER: ${POSTGRES_USER:-relaywave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaywave}
      POSTGRES_DB: ${POSTGRES_DB:-relaywave}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relaywave} -d ${POSTGRES_DB:-relaywave}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

  redis:
    image: redis:7-alpine
    ports:
      # Loopback-only host access for local `uv run` development, same
      # reasoning as postgres above: the API and pytest run on the host, not
      # in a container, and need a way to reach Redis directly.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

volumes:
  postgres_data:

networks:
  relaywave:
    driver: bridge
