# Phase 1: Postgres is now exposed on 127.0.0.1:5433 so the API can run
# locally with `uv run uvicorn --reload` against the same database the
# containers use. The API still does not talk to Redis (that wiring —
# redis-py fan-out — lands in Phase 2 per docs/project-definition.md).

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: relaywave-backend
      ENVIRONMENT: local
      DEBUG: "true"
      # In-container URL: postgres is reached by its service name on the
      # Compose network. asyncpg driver scheme.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relaywave}:${POSTGRES_PASSWORD:-relaywave}@postgres:5432/${POSTGRES_DB:-relaywave}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl; use the stdlib instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

  postgres:
    image: postgres:16-alpine
    ports:
      # Loopback-only host access for local `uv run` development. Never
      # exposed to the external network. Mapped to host 5433 because the
      # sibling `verbatim` project already owns 0.0.0.0:5432.
      - "127.0.0.1:5433:5432"
    environment:
      # Read from root .env (see .env.example). Because Postgres is now
      # host-reachable, set a real POSTGRES_PASSWORD instead of the old
      # relaywave/relaywave dev default.
      POSTGRES_USER: ${POSTGRES_USER:-relaywave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaywave}
      POSTGRES_DB: ${POSTGRES_DB:-relaywave}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relaywave} -d ${POSTGRES_DB:-relaywave}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

volumes:
  postgres_data:

networks:
  relaywave:
    driver: bridge
