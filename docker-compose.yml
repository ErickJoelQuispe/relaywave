# Phase 1: Postgres is now exposed on 127.0.0.1:5432 so the API can run
# locally with `uv run uvicorn --reload` against the same database the
# containers use. Phase 2 does the same for Redis (127.0.0.1:6379).
#
# Phase 2 slice 4: `api` and `api-2` are two independent replicas of the same
# image, each with its own in-memory `ConnectionManager`, sharing the same
# Postgres and Redis via the Compose network service names. This is the
# empirical proof that Redis Pub/Sub fan-out (RoomBroadcaster, wired into the
# WS route in slices 2-3) actually delivers messages across processes: a
# socket connected to `api` and a socket connected to `api-2` are on entirely
# separate hosts as far as the OS is concerned, and can only see each other's
# broadcasts through Redis. There is deliberately NO load balancer (nginx,
# haproxy, etc.) in front of them — request routing across replicas is
# Phase 3's job (a Kubernetes Service), out of scope here per
# docs/project-definition.md §5.3/§5.4 and ADR-004. Test clients connect
# directly to each replica's distinct host port instead.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: relaywave-backend
      ENVIRONMENT: local
      DEBUG: "true"
      # In-container URL: postgres is reached by its service name on the
      # Compose network. asyncpg driver scheme.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relaywave}:${POSTGRES_PASSWORD:-relaywave}@postgres:5432/${POSTGRES_DB:-relaywave}
      # Same reasoning as DATABASE_URL: redis is reached by its service name
      # on the Compose network, not by the loopback address the host uses.
      REDIS_URL: redis://redis:6379/0
      # Required, no default (see app/core/config.py) — must be set in the
      # root .env (see .env.example). `:?` fails the container loudly at
      # startup instead of silently shipping a hardcoded signing key.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env — see .env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl; use the stdlib instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

  # Second replica for Phase 2 slice 4: identical build/environment to `api`,
  # only the host-side port differs (the container itself always listens on
  # 8000 — see backend/Dockerfile). Reaches the SAME Postgres and Redis as
  # `api` through the Compose network, which is exactly what makes
  # cross-replica delivery possible.
  api-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_NAME: relaywave-backend
      ENVIRONMENT: local
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relaywave}:${POSTGRES_PASSWORD:-relaywave}@postgres:5432/${POSTGRES_DB:-relaywave}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env — see .env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

  postgres:
    image: postgres:16-alpine
    ports:
      # Loopback-only host access for local `uv run` development. Never
      # exposed to the external network.
      - "127.0.0.1:5432:5432"
    environment:
      # Read from root .env (see .env.example). Because Postgres is now
      # host-reachable, set a real POSTGRES_PASSWORD instead of the old
      # relaywave/relaywave dev default.
      POSTGRES_USER: ${POSTGRES_USER:-relaywave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaywave}
      POSTGRES_DB: ${POSTGRES_DB:-relaywave}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relaywave} -d ${POSTGRES_DB:-relaywave}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

  redis:
    image: redis:7-alpine
    ports:
      # Loopback-only host access for local `uv run` development, same
      # reasoning as postgres above: the API and pytest run on the host, not
      # in a container, and need a way to reach Redis directly.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - relaywave

volumes:
  postgres_data:

networks:
  relaywave:
    driver: bridge
