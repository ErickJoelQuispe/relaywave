extend = "pyproject.toml"

# Alembic scaffold is generated boilerplate (env.py + versions/*.py). It
# intentionally ships `Union[...]` annotations and long `sa.Column(...)` lines
# that ruff's UP/E501 rules flag, and the local `alembic/` directory makes
# ruff treat `alembic` as a first-party import. Exclude it so autogenerated
# migrations don't fail `ruff check .`.
extend-exclude = ["alembic"]
