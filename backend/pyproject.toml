[project]
name = "relaywave-backend"
version = "0.1.0"
description = "Relaywave backend — FastAPI real-time chat API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "email-validator>=2.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "alembic>=1.13",
    "pytest-asyncio>=0.24",
    "httpx-ws>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A single session-scoped event loop is required so the session-scoped test
# engine (asyncpg) and the function-scoped fixtures/tests all share one loop.
# Without this, asyncpg connections created in the session loop get reused in
# per-test loops and fail with "another operation is in progress".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
