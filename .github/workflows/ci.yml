name: CI

# Phase 0 per ADR-003: verification-only pipeline. No deployment, no image
# push — this only proves the code lints, tests pass, and the backend
# container still builds. Kubernetes rollouts stay manual until Phase 4.
on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Phase 4 slice 3: real Postgres + Redis service containers so the
    # integration test suite (test_broadcaster.py, test_ws.py, etc.) actually
    # runs instead of skipping. Service containers are reachable on
    # localhost from the (non-containerized) ubuntu-latest runner via the
    # mapped ports below — matching Settings' localhost defaults in
    # app/core/config.py, no DATABASE_URL/REDIS_URL override needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaywave
          POSTGRES_PASSWORD: relaywave
          POSTGRES_DB: relaywave
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U relaywave -d relaywave"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5
    env:
      # Test-only signing key — never used outside CI, not a real secret.
      JWT_SECRET_KEY: ci-test-only-jwt-secret-key-not-for-production-use
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # astral-sh/setup-uv also bundles GitHub Actions cache support for
      # uv's resolution/download cache, keyed on uv.lock — this avoids
      # re-downloading the same wheels on every run.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build only — no push/registry auth. This runs on every push and PR
      # (including forks) and just proves the container still compiles.
      - name: Build backend image
        run: docker build ./backend

  # Phase 4 slice 4 per ADR-003: publish a versioned image to GHCR on every
  # merge to master/main. Never publish "latest" — the short commit SHA is
  # the only tag, so a deploy always names an exact, traceable build.
  docker-push:
    runs-on: ubuntu-latest
    needs: [backend, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR requires a lowercase image path; the GitHub repository/owner
      # names here are mixed-case.
      - name: Set lowercase image repository
        run: echo "IMAGE_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute short commit SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPOSITORY }}-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
