name: CI

# Phase 0 per ADR-003: verification-only pipeline. No deployment, no image
# push — this only proves the code lints, tests pass, and the backend
# container still builds. Kubernetes rollouts stay manual until Phase 4.
on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Phase 4 slice 3: real Postgres + Redis service containers so the
    # integration test suite (test_broadcaster.py, test_ws.py, etc.) actually
    # runs instead of skipping. Service containers are reachable on
    # localhost from the (non-containerized) ubuntu-latest runner via the
    # mapped ports below — matching Settings' localhost defaults in
    # app/core/config.py, no DATABASE_URL/REDIS_URL override needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaywave
          POSTGRES_PASSWORD: relaywave
          POSTGRES_DB: relaywave
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U relaywave -d relaywave"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5
    env:
      # Test-only signing key — never used outside CI, not a real secret.
      JWT_SECRET_KEY: ci-test-only-jwt-secret-key-not-for-production-use
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # astral-sh/setup-uv also bundles GitHub Actions cache support for
      # uv's resolution/download cache, keyed on uv.lock — this avoids
      # re-downloading the same wheels on every run.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build only — no push/registry auth. Phase 0 just proves the
      # container still compiles; deployment stays manual until Phase 4.
      - name: Build backend image
        run: docker build ./backend
